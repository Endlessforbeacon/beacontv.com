<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beacon TV - Streaming TV Digital</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

    <!-- Navbar Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary sticky-top">
        <div class="container-fluid px-3 px-lg-4 d-flex align-items-center justify-content-between flex-wrap">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="Image/Beacon TV Logo.png" alt="Beacon TV" height="35" onerror="this.style.display='none'">
                <span class="fw-bold tracking-wide text-danger fs-4 brand-text">BEACON<span class="text-white">TV</span></span>
            </a>

            <!-- Jam 3 Zona Waktu Indonesia -->
            <div class="timezone-clock-wrapper px-3 py-1 rounded-pill d-flex gap-3 align-items-center my-1">
                <div><span class="fw-bold text-dark">WIB:</span> <span id="clock-wib" class="clock-item text-dark fw-bold">00:00:00</span></div>
                <div><span class="fw-bold text-dark">WITA:</span> <span id="clock-wita" class="clock-item text-dark fw-bold">00:00:00</span></div>
                <div><span class="fw-bold text-dark">WIT:</span> <span id="clock-wit" class="clock-item text-dark fw-bold">00:00:00</span></div>
            </div>

            <!-- Tombol Aksi Navbar -->
            <div class="nav-buttons-wrapper d-flex align-items-center gap-2">
                <button class="btn btn-outline-warning btn-sm rounded-pill px-3 fw-bold" id="btn-open-report">
                    <i class="fa-solid fa-bug me-1"></i> <span>Laporkan Bug</span>
                </button>
                <button class="btn btn-danger btn-sm rounded-pill px-3 fw-bold" id="btn-auth-action">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> <span>Masuk</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Layout -->
    <div class="container-fluid py-3 px-lg-4">
        <div class="row g-3">
            
            <!-- Kolom Player Video (Kiri) -->
            <div class="col-lg-8">
                <div class="player-container position-relative bg-black rounded shadow overflow-hidden">
                    
                    <!-- Player Video Plyr -->
                    <video id="video-player" playsinline crossorigin></video>
                    
                    <!-- WATERMARK / LOGO BEACON TV DI DALAM PLAYER -->
                    <img id="player-watermark" src="Image/Beacon TV Logo.png" alt="Beacon TV Watermark" class="position-absolute" onerror="this.style.display='none'">

                    <!-- Overlay Play Normal -->
                    <div id="play-overlay" class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center">
                        <button id="start-stream-btn" class="btn btn-danger btn-lg px-4 py-3 rounded-pill fw-bold shadow-lg d-flex align-items-center gap-2">
                            <i class="fa-solid fa-play fs-4"></i> KLIK UNTUK MENONTON
                        </button>
                    </div>

                    <!-- OVERLAY BACKGROUND GAMBAR PERINGATAN (AUTOMATIC BLACKOUT / HAK SIAR) -->
                    <div id="blackout-overlay" class="position-absolute top-0 start-0 w-100 h-100 d-none justify-content-center align-items-center">
                        <img id="restriction-image" src="" alt="Peringatan Pembatasan Siaran" class="w-100 h-100 object-fit-contain">
                    </div>

                </div>
                
                <!-- Detail Channel Terpilih & Action Bar -->
                <div class="mt-3 d-flex justify-content-between align-items-start flex-wrap gap-2">
                    <div>
                        <h3 id="playing-title" class="fw-bold mb-1 fs-4">Memuat Saluran...</h3>
                        <p class="text-muted mb-0 small">Sistem Penayangan Digital Endless For Beacon.</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-dark text-danger border-secondary" id="btn-report-channel">
                            <i class="fa-solid fa-flag me-1"></i> Laporkan Saluran Ini
                        </button>
                    </div>
                </div>
            </div>

            <!-- Kolom Daftar Saluran / Playlist (Kanan) -->
            <div class="col-lg-4">
                <div class="card bg-black border-secondary text-white h-100">
                    <div class="card-header border-secondary">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="mb-0 fw-bold fs-6"><i class="fa-solid fa-list text-danger me-2"></i>Daftar Saluran</h5>
                        </div>
                        <!-- Search Box -->
                        <div class="input-group input-group-sm mb-2">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" id="search-channel-input" class="form-control bg-dark text-white border-secondary" placeholder="Cari saluran TV...">
                        </div>
                        <!-- Filter Kategori -->
                        <div class="category-filter-wrapper d-flex gap-1 overflow-x-auto pb-1">
                            <button class="btn btn-xs btn-outline-danger active filter-btn" data-category="all">Semua</button>
                            <button class="btn btn-xs btn-outline-secondary text-light filter-btn" data-category="official">Official</button>
                            <button class="btn btn-xs btn-outline-secondary text-light filter-btn" data-category="national">Nasional</button>
                        </div>
                    </div>
                    <div class="card-body p-2 channel-list" id="channels-container">
                        <!-- Daftar channel akan di-render secara dinamis via JS -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- MODAL AUTHENTICATION -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white auth-card">
                <div class="modal-body p-4">
                    <div class="auth-tabs-wrapper mb-3">
                        <button class="auth-tab-btn active w-50" id="tab-login-btn">Masuk</button>
                        <button class="auth-tab-btn w-50" id="tab-register-btn">Daftar</button>
                    </div>

                    <div id="authAlert" class="alert d-none"></div>

                    <!-- Form Login -->
                    <form id="loginForm">
                        <div class="modern-input-group mb-3">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="loginEmail" class="form-control modern-input" placeholder="Alamat Email" required>
                        </div>
                        <div class="modern-input-group mb-3">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="loginPassword" class="form-control modern-input" placeholder="Kata Sandi" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2-5 rounded-pill fw-bold shadow-danger">Masuk Sekarang</button>
                    </form>

                    <!-- Form Register -->
                    <form id="registerForm" class="d-none">
                        <div class="modern-input-group mb-3">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="regName" class="form-control modern-input" placeholder="Nama Lengkap" required>
                        </div>
                        <div class="modern-input-group mb-3">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="regEmail" class="form-control modern-input" placeholder="Alamat Email" required>
                        </div>
                        <div class="modern-input-group mb-3">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="regPassword" class="form-control modern-input" placeholder="Kata Sandi (Min. 6 Karakter)" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2-5 rounded-pill fw-bold shadow-danger">Daftar Akun Baru</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PROFIL PENGGUNA -->
    <div class="modal fade" id="userProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-header-title fw-bold fs-6"><i class="fa-solid fa-id-card text-danger me-2"></i>Pengaturan Profil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="profileAlert" class="alert d-none"></div>
                    <form id="updateProfileForm">
                        <div class="text-center mb-3">
                            <img id="profileAvatarPreview" src="" class="rounded-circle border border-danger p-1" width="80" height="80">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Nama Tampilan</label>
                            <input type="text" id="profileDisplayName" class="form-control modern-input" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Email (Tetap)</label>
                            <input type="email" id="profileEmail" class="form-control modern-input text-muted" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Ubah Avatar (Seed Karakter)</label>
                            <input type="text" id="profileAvatarSeed" class="form-control modern-input" placeholder="Ketik kata kunci avatar...">
                        </div>
                        <button type="submit" class="btn btn-danger w-100 rounded-pill fw-bold mb-2">Simpan Perubahan</button>
                        <button type="button" id="btn-modal-logout" class="btn btn-outline-danger w-100 rounded-pill fw-bold">Keluar Akun</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL LAPORAN BUG & KENDALA -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold fs-6"><i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>Laporkan Bug & Kendala</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="reportAlert" class="alert d-none"></div>
                    <form id="reportForm">
                        <input type="hidden" id="reportCategory" value="">
                        <label class="form-label small fw-bold">Pilih Kategori Kendala:</label>
                        <div class="row g-2 mb-3">
                            <div class="col-4">
                                <div class="category-card" data-category="system_bug">
                                    <i class="fa-solid fa-code category-icon"></i>
                                    <span class="category-label">Bug Sistem</span>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="category-card" data-category="stream_issue">
                                    <i class="fa-solid fa-tv category-icon"></i>
                                    <span class="category-label">Kendala TV</span>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="category-card" data-category="other">
                                    <i class="fa-solid fa-circle-question category-icon"></i>
                                    <span class="category-label">Lainnya</span>
                                </div>
                            </div>
                        </div>

                        <div id="channelSelectContainer" class="mb-3 d-none">
                            <label class="form-label small text-muted">Saluran Terkait:</label>
                            <input type="text" id="reportChannelName" class="form-control modern-input" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">Jenis Masalah:</label>
                            <select id="reportType" class="form-select modern-select" required disabled>
                                <option value="" selected disabled>-- Pilih Kategori Di Atas Terlebih Dahulu --</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">Deskripsi Kendala:</label>
                            <textarea id="reportDescription" class="form-control modern-textarea" rows="3" placeholder="Jelaskan kendala secara singkat..." required></textarea>
                        </div>

                        <button type="submit" id="btnSubmitReport" class="btn btn-warning w-100 rounded-pill fw-bold">
                            <i class="fa-solid fa-paper-plane me-1"></i> Kirim Laporan
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- SDK / JS External -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
        })();
    </script>
    
    <!-- Custom Script -->
    <script type="module" src="script.js"></script>
</body>
</html>
